<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Picture Poker</title>
                <link rel="stylesheet" href="style.css">
                    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
                    </head>
                    <body>
                        <!-- SETUP SCREEN -->
                            <div id="setup-screen">
                                    <h1>🖼️ Picture Poker</h1>
                                            <div class="panel">
                                                        <h3>Join or Create a Table</h3>
                                                                    <p>Agree on a secret room code with your friend (e.g., "FRIDAY").</p>
                                                                                
                                                                                            <input type="text" id="room-code" placeholder="Enter Room Code" style="text-transform: uppercase; font-size: 20px; text-align: center;">
                                                                                                        <br>
                                                                                                                    <button id="host-btn">1. Create Table (Dealer)</button>
                                                                                                                                <button id="join-btn">2. Join Table (Player 2)</button>
                                                                                                                                            
                                                                                                                                                        <p id="status-msg"></p>
                                                                                                                                                                </div>
                                                                                                                                                                    </div>

                                                                                                                                                                        <!-- GAME SCREEN -->
                                                                                                                                                                            <div id="game-screen" style="display: none;">
                                                                                                                                                                                    
                                                                                                                                                                                            <div id="poker-table">
                                                                                                                                                                                                        <div id="dealer-controls" style="display: none;">
                                                                                                                                                                                                                        <button id="deal-btn">Deal New Hand</button>
                                                                                                                                                                                                                                        <button id="reveal-btn" disabled>Reveal Next Cards</button>
                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                <h2>Community Cards</h2>
                                                                                                                                                                                                                                                                            <div id="community-cards" class="card-container">
                                                                                                                                                                                                                                                                                            <p>Waiting for dealer...</p>
                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                    <h2>Your Hand</h2>
                                                                                                                                                                                                                                                                                                                                <div id="my-hand" class="card-container">
                                                                                                                                                                                                                                                                                                                                                <p>Waiting for cards...</p>
                                                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                            <hr>

                                                                                                                                                                                                                                                                                                                                                                                    <h2>The Pot (Pictures Bet)</h2>
                                                                                                                                                                                                                                                                                                                                                                                            <p id="rule-tracker">Current rule: You must bet <b>1</b> picture(s).</p>
                                                                                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                                                                            <div id="pot-area"></div>

                                                                                                                                                                                                                                                                                                                                                                                                                    <div id="player-area">
                                                                                                                                                                                                                                                                                                                                                                                                                                <h3>Your Turn</h3>
                                                                                                                                                                                                                                                                                                                                                                                                                                            <input type="file" id="pic-upload" accept="image/*" multiple>
                                                                                                                                                                                                                                                                                                                                                                                                                                                        <button id="bet-btn">Bet Picture(s)</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <script src="script.js"></script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </html>
