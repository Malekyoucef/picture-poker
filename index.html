<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Picture Poker</title>
                <link rel="stylesheet" href="style.css">
                    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
                    </head>
                    <body>
                        <!-- SETUP SCREEN -->
                            <div id="setup-screen">
                                    <h1>🖼️ Secret Picture Poker</h1>
                                            <div class="panel">
                                                        <input type="text" id="player-name" placeholder="Enter Your Name" style="font-size: 20px; text-align: center; margin-bottom: 15px;">
                                                                    <br>
                                                                                <input type="text" id="room-code" placeholder="Enter Secret Room Code" style="text-transform: uppercase; font-size: 20px; text-align: center;">
                                                                                            <br>
                                                                                                        <button id="host-btn">1. Create Table (Dealer)</button>
                                                                                                                    <button id="join-btn">2. Join Table (Player 2)</button>
                                                                                                                                <p id="status-msg"></p>
                                                                                                                                        </div>
                                                                                                                                            </div>

                                                                                                                                                <!-- GAME SCREEN -->
                                                                                                                                                    <div id="game-screen" style="display: none;">
                                                                                                                                                            
                                                                                                                                                                    <!-- OPPONENT AREA -->
                                                                                                                                                                            <div id="opponent-area" class="player-zone">
                                                                                                                                                                                        <h3 id="opp-name-display">Opponent</h3>
                                                                                                                                                                                                    <div id="opp-hand" class="card-container">
                                                                                                                                                                                                                    <div class="card hidden">?</div>
                                                                                                                                                                                                                                    <div class="card hidden">?</div>
                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                            <p id="opp-action-text" class="action-text">Waiting...</p>
                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                            <!-- TABLE CENTER (COMMUNITY CARDS & POT) -->
                                                                                                                                                                                                                                                                                    <div id="table-center">
                                                                                                                                                                                                                                                                                                <div id="dealer-controls" style="display: none;">
                                                                                                                                                                                                                                                                                                                <button id="deal-btn">Deal New Hand</button>
                                                                                                                                                                                                                                                                                                                                <button id="reveal-btn" disabled>Reveal Next Cards</button>
                                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                                        <h2>Community Cards</h2>
                                                                                                                                                                                                                                                                                                                                                                    <div id="community-cards" class="card-container">
                                                                                                                                                                                                                                                                                                                                                                                    <p>Waiting for dealer...</p>
                                                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                                                            <div id="pot-zone">
                                                                                                                                                                                                                                                                                                                                                                                                                            <h2>The Pot: <span id="pot-count">0</span> Pictures</h2>
                                                                                                                                                                                                                                                                                                                                                                                                                                            <!-- Hidden pictures appear as ? boxes here -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div id="hidden-pot-area"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <!-- Revealed pictures go here if you win -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div id="revealed-pot-area"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <!-- MY AREA -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div id="my-area" class="player-zone">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <p id="my-action-text" class="action-text">Your Turn</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div id="my-hand" class="card-container">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <p>Waiting for cards...</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <h3 id="my-name-display">Me</h3>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="controls-container">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="betting-controls">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <button id="btn-check" class="action-btn">Check</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <button id="btn-fold" class="action-btn" style="background-color: #e74c3c;">Fold</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="betting-controls raise-box">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <p>Upload picture(s) to Call or Raise:</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <input type="file" id="pic-upload" accept="image/*" multiple>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <button id="btn-bet" class="action-btn" style="background-color: #27ae60;">Bet / Raise</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <button id="btn-claim-win" style="background-color: #9b59b6; width: 100%; margin-top: 15px;">🏆 I Won! (Reveal Pot)</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <script src="script.js"></script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </html>
